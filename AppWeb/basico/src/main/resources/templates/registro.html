<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Varroa Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 350px; border-radius: 15px; border-top: 5px solid #198754;">
        <h3 class="text-center mb-4 fw-bold">Nuevo Apicultor</h3>
        <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>
        <form th:action="@{/registro}" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre de usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required minlength="4">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">CREAR CUENTA</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/login}" class="text-muted small">Volver al login</a>
        </div>
    </div>
</body>
</html>
